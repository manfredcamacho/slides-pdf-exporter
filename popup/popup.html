<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides PDF Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-branding">
        <img src="../icons/icon-48.png" alt="Logo" class="header-icon">
        <div>
          <h1 class="header-title" data-i18n="headerTitle">Slides PDF</h1>
          <span class="header-subtitle" data-i18n="headerSubtitle">High-Definition PDF Exporter</span>
        </div>
      </div>
      <div class="lang-selector">
        <button type="button" class="lang-btn" id="lang-es" title="Español">ES</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang-btn" id="lang-en" title="English">EN</button>
      </div>
    </header>

    <!-- State: Not on Google Slides -->
    <div id="state-inactive" class="state-box" style="display: none;">
      <div class="inactive-icon">📄</div>
      <h3 data-i18n="inactiveTitle">No presentation detected</h3>
      <p data-i18n="inactiveDesc">Open a presentation in Google Slides to export.</p>
    </div>

    <!-- State: Active on Google Slides -->
    <div id="state-active" class="state-box">
      <!-- Presentation Info Banner -->
      <div class="info-card">
        <div class="info-title" id="doc-title" data-i18n="loadingTitle">Loading presentation...</div>
        <div class="info-meta">
          <span id="slide-count-badge" data-i18n="detectingSlides">📊 Detecting slides...</span>
          <span id="notes-badge" data-i18n="notesBadgeDefault">📝 Speaker notes</span>
        </div>
      </div>

      <!-- Controls Form -->
      <div class="form-section">
        <!-- Hidden Slides Section -->
        <div class="form-row-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="check-hidden" checked>
            <span class="checkbox-custom"></span>
            <span class="checkbox-text" data-i18n="checkHidden">Include hidden / skipped slides</span>
          </label>
        </div>

        <!-- Searchable Text Section -->
        <div class="form-row-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="check-searchable" checked>
            <span class="checkbox-custom"></span>
            <span class="checkbox-text" data-i18n="checkSearchable">Selectable and searchable text (Ctrl + F)</span>
          </label>
        </div>

        <!-- Speaker Notes Section -->
        <div class="form-row-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="check-notes" checked>
            <span class="checkbox-custom"></span>
            <span class="checkbox-text" data-i18n="checkNotes">Include speaker notes</span>
          </label>
        </div>

        <div class="sub-options" id="notes-options-container">
          <label for="select-notes-format" class="form-label-sub" data-i18n="checkNotes">Notes format:</label>
          <select id="select-notes-format" class="form-select-sm">
            <option value="appendix" selected data-i18n="formatAppendix">Appendix at the end of PDF</option>
            <option value="slide_with_notes" data-i18n="formatCompanion">Slide followed by its notes page</option>
          </select>
        </div>
      </div>

      <!-- Progress Section -->
      <div id="progress-container" class="progress-container" style="display: none;">
        <div class="progress-labels">
          <span id="progress-message">Processing slides...</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions-section">
        <button id="btn-export-pdf" class="btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
          <span data-i18n="btnExport">Download PDF</span>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>High Resolution &bull; Searchable PDF &bull; 100% Local</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
